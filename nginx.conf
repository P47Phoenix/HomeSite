# HomeSite serving config (architecture §1/§3) — copied to
# /etc/nginx/conf.d/default.conf in the image (see Dockerfile).
# Versioned with the site so cache policy + headers ride every image build.
#
# NOTE nginx add_header inheritance: a location that declares ANY add_header
# inherits none from the server level, so the SEC-09 header set is repeated
# verbatim in every location block. Keep the four lines identical everywhere.
# If JS is ever added as progressive enhancement, CSP gains `script-src 'self'`
# in the same PR as the code (NFR-10 docs-same-PR rule).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip on (architecture §3). text/html is compressed by default.
    gzip on;
    gzip_types text/css application/json image/svg+xml;
    gzip_vary on;

    # /healthz — 200 used by k8s readiness+liveness probes (FR-13) and CI smoke (F-5).
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        return 200 "ok\n";
    }

    # Content-hashed assets: immutable for a year (FR-02/F6).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # index.html + anything non-hashed: always revalidate (FR-02/F6).
    # Unknown paths 404 — never wildcard-200 (TC-S6-04 negative check).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }
}
