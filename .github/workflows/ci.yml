# CI test pyramid + gates (architecture §2, fail-fast order):
# typecheck/lint -> unit -> integration -> build+gates -> e2e -> secret scan
# -> image smoke (every run) -> multi-arch publish (main pushes only, S6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# SEC-06: least-privilege GITHUB_TOKEN. Only the publish job elevates (job-scoped
# packages elevation — the single point of elevation in this repo). The privileged
# PR-target trigger is banned repo-wide (enforced by scripts/check-workflow-security.sh).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  unit:
    needs: typecheck-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Coverage threshold lives in vitest.config.ts (M4) — never in this YAML.
      - run: npm run test:unit

  integration:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  build-gates:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle-size gate (M10, fail > 250 KB gzipped JS)
        run: npm run check:bundle
      - name: Docs-coverage gate (M2, OQ-M3 name-based rule)
        run: npm run check:docs-coverage
      - name: Docs-presence check (M8a)
        run: npm run check:docs-presence
      - name: Contrast gate (AC-1/AC-2)
        run: npm run check:contrast

  e2e:
    needs: build-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Playwright runs against `vite preview` of the built dist/ (CF-D3) — never the dev server.
      - run: npm run test:e2e

  secret-scan:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, FR-15a)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Workflow-security grep-asserts (SEC-06/SEC-07)
        run: bash scripts/check-workflow-security.sh

  # Image smoke (QA contract F-5) — runs on EVERY run, PRs included, with zero
  # elevation: proves the image (not just dist/) serves healthz, cache policy,
  # SEC-09 headers, 404s; then cross-builds the arm64 leg without publishing.
  image-smoke:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build amd64 image (loaded into local docker)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homesite:smoke
          provenance: false
      - name: Image smoke — healthz, cache policy, SEC-09 headers, 404, non-root
        run: bash scripts/image-smoke.sh homesite:smoke
      - name: Cross-build check — arm64 leg builds pre-merge, no push (R1 / loop-2 m-8)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false

  # Multi-arch publish (S6 AC2/AC3; SEC-04/SEC-06). Gated to push-to-main:
  # PRs never publish, and this is the ONLY job in the repo that elevates
  # beyond contents: read (security AC #9).
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: image-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/p47phoenix/homesite
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Compute immutable tag (sha-<12-char-git-sha>)
        id: tag
        run: echo "tag=sha-$(printf '%s' '${{ github.sha }}' | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # provenance/sbom off: keeps the manifest list to exactly the two platform
      # entries the crane gate below asserts (no unknown/unknown attestations).
      - name: Build & push multi-arch (amd64 + arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/p47phoenix/homesite:${{ steps.tag.outputs.tag }}
            ghcr.io/p47phoenix/homesite:main
          provenance: false
          sbom: false
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Crane gate — tag<->digest agreement + both platforms in manifest list
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          BUILT='${{ steps.build.outputs.digest }}'
          SHA_DIGEST=$(crane digest "$IMAGE:$TAG")
          MAIN_DIGEST=$(crane digest "$IMAGE:main")
          echo "built: $BUILT"
          echo "crane $IMAGE:$TAG  -> $SHA_DIGEST"
          echo "crane $IMAGE:main -> $MAIN_DIGEST"
          [ "$SHA_DIGEST" = "$BUILT" ]
          [ "$MAIN_DIGEST" = "$BUILT" ]
          crane manifest "$IMAGE:$TAG" | jq -e \
            '[.manifests[].platform | select(.os=="linux") | .architecture] | contains(["amd64","arm64"])'
      - name: Job summary — copy-paste pin for the Containers bump PR (FR-09/SEC-04)
        run: |
          {
            echo "## Published image"
            echo ""
            echo '```'
            echo "$IMAGE:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "- tag: \`${{ steps.tag.outputs.tag }}\` (deploy pin; moving \`main\` also pushed)"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- paste the full ref above into helm/charts/homesite/values.yaml in the Containers repo"
          } >> "$GITHUB_STEP_SUMMARY"
